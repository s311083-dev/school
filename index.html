        let currentTrailerUrl = "";
        let activeDramaName = ""; // 用來追蹤目前彈窗顯示的是哪一部

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId + 'Page').style.display = 'block';
            
            const filterSec = document.getElementById('filterSection');
            
            if(pageId === 'list') {
                filterSec.style.display = 'block';
                renderList(dramaList, 'dramaContainer');
            } else if (pageId === 'fav') {
                filterSec.style.display = 'none';
                renderFavoriteList(); // 渲染收藏頁面
            } else {
                filterSec.style.display = 'none';
            }
        }

        // 修改 renderList 使其能渲染到不同的 Container
        function renderList(dataArray, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            
            if(dataArray.length === 0) {
                container.innerHTML = `<p class="empty-msg">暫時沒有相關劇集唷！</p>`;
                return;
            }

            dataArray.forEach(d => {
                const card = document.createElement('div');
                card.className = 'drama-card';
                card.onclick = () => openModal(d.name); // 改用名稱開彈窗
                card.innerHTML = `<img src="${d.img}"><h4>${d.name}</h4>`;
                container.appendChild(card);
            });
        }

        // 專屬渲染收藏清單的函式
        function renderFavoriteList() {
            const favs = dramaList.filter(d => d.isFavorite);
            renderList(favs, 'favContainer');
        }

        function filterDramas(type) {
            if (type === '全部') {
                renderList(dramaList, 'dramaContainer');
            } else {
                const filtered = dramaList.filter(d => d.type === type);
                renderList(filtered, 'dramaContainer');
            }
        }

        // 修改 openModal，從陣列找資料，確保狀態一致
        function openModal(name) {
            const d = dramaList.find(item => item.name === name);
            if(!d) return;

            activeDramaName = name; // 存入全域變數
            document.getElementById('modalName').innerText = d.name;
            document.getElementById('modalType').innerText = "類型：" + d.type;
            document.getElementById('modalDesc').innerText = d.desc;
            document.getElementById('modalImg').src = d.img;
            
            currentTrailerUrl = d.trailer; 
            const playBtn = document.getElementById('playBtn');
            const videoBox = document.getElementById('videoBox');
            const modalImg = document.getElementById('modalImg');

            videoBox.style.display = "none";
            document.getElementById('modalTrailer').src = "";
            modalImg.style.display = "block";

            playBtn.style.display = (d.trailer && d.trailer !== "") ? "block" : "none";
            
            // 愛心狀態：根據資料顯示紅或灰
            const favBtn = document.getElementById('favBtn');
            if(d.isFavorite) {
                favBtn.classList.add('active');
            } else {
                favBtn.classList.remove('active');
            }

            resetStars();
            document.getElementById('dramaModal').style.display = "block";
        }

        // 新增：處理收藏按鈕點擊
        function handleFavoriteClick() {
            const drama = dramaList.find(d => d.name === activeDramaName);
            if(drama) {
                drama.isFavorite = !drama.isFavorite; // 反轉狀態
                
                // 更新 UI 愛心顏色
                const btn = document.getElementById('favBtn');
                if(drama.isFavorite) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
                
                // 如果人在收藏清單頁面，即時更新列表
                if(document.getElementById('favPage').style.display === 'block') {
                    renderFavoriteList();
                }
            }
        }

        function startVideo() {
            if (currentTrailerUrl !== "") {
                document.getElementById('modalImg').style.display = "none";    
                document.getElementById('playBtn').style.display = "none";     
                document.getElementById('videoBox').style.display = "block";   
                document.getElementById('modalTrailer').src = currentTrailerUrl + "?autoplay=1"; 
            }
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            body.classList.toggle('dark-mode');
            btn.innerText = body.classList.contains('dark-mode') ? "☀️ 淺色模式" : "🌙 深色模式";
        }

        function setRating(n) {
            const stars = document.querySelectorAll('#starContainer span');
            stars.forEach((star, index) => {
                star.innerText = index < n ? '★' : '☆';
                index < n ? star.classList.add('active') : star.classList.remove('active');
            });
        }

        function resetStars() {
            document.querySelectorAll('#starContainer span').forEach(star => {
                star.innerText = '☆';
                star.classList.remove('active');
            });
        }

        function closeModal() { 
            document.getElementById('dramaModal').style.display = "none"; 
            document.getElementById('modalTrailer').src = ""; 
        }
        
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); };
        
        showPage('home');
    </script>
