        let currentTrailerUrl = "";

        function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById(pageId + 'Page').style.display = 'block';
    const filterSec = document.getElementById('filterSection');
    if(pageId === 'list') {
        filterSec.style.display = 'block';
        renderList(dramaList); // 這裡原本是 dramaData，改為 dramaList
    } else {
        filterSec.style.display = 'none';
    }
}

        function renderList(dataArray) {
            const container = document.getElementById('dramaContainer');
            container.innerHTML = "";
            dataArray.forEach(d => {
                const card = document.createElement('div');
                card.className = 'drama-card';
                card.onclick = () => openModal(d.name, d.type, d.img, d.desc, d.trailer);
                card.innerHTML = `<img src="${d.img}"><h4>${d.name}</h4>`;
                container.appendChild(card);
            });
        }

        function filterDramas(type) {
    if (type === '全部') {
        renderList(dramaList); // 這裡原本是 dramaData，改為 dramaList
    } else {
        const filtered = dramaList.filter(d => d.type === type); // 這裡原本是 dramaData，改為 dramaList
        renderList(filtered);
    }
}

        function openModal(name, type, img, desc, trailer) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalType').innerText = "類型：" + type;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalImg').src = img;
            
            currentTrailerUrl = trailer; 

            const playBtn = document.getElementById('playBtn');
            const videoBox = document.getElementById('videoBox');
            const modalImg = document.getElementById('modalImg');

            // 每次打開時恢復初始外觀
            videoBox.style.display = "none";
            document.getElementById('modalTrailer').src = "";
            modalImg.style.display = "block";

            // 如果該劇有預告片連結則顯示按鈕，否則隱藏
            if (trailer && trailer !== "") {
                playBtn.style.display = "block";
            } else {
                playBtn.style.display = "none";
            }
            
            document.getElementById('favBtn').classList.remove('active');
            resetStars();
            document.getElementById('dramaModal').style.display = "block";
        }

        function startVideo() {
            const videoBox = document.getElementById('videoBox');
            const modalImg = document.getElementById('modalImg');
            const trailerFrame = document.getElementById('modalTrailer');
            const playBtn = document.getElementById('playBtn');

            if (currentTrailerUrl !== "") {
                modalImg.style.display = "none";    
                playBtn.style.display = "none";     
                videoBox.style.display = "block";   
                trailerFrame.src = currentTrailerUrl + "?autoplay=1"; 
            }
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            body.classList.toggle('dark-mode');
            btn.innerText = body.classList.contains('dark-mode') ? "☀️ 淺色模式" : "🌙 深色模式";
        }

        function setRating(n) {
            const stars = document.querySelectorAll('#starContainer span');
            stars.forEach((star, index) => {
                star.innerText = index < n ? '★' : '☆';
                index < n ? star.classList.add('active') : star.classList.remove('active');
            });
        }

        function resetStars() {
            document.querySelectorAll('#starContainer span').forEach(star => {
                star.innerText = '☆';
                star.classList.remove('active');
            });
        }

        function toggleFavorite() {
            document.getElementById('favBtn').classList.toggle('active');
        }

        function closeModal() { 
            document.getElementById('dramaModal').style.display = "none"; 
            document.getElementById('modalTrailer').src = ""; 
        }
        
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); };
        
        showPage('home');
    </script>
</body>
</html>
